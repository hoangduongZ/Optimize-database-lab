services:
  db:
    image: postgres:16
    container_name: optimize-lab-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: optimize_lab
    ports:
      - "5555:5432"
    volumes:
      - lab_data:/var/lib/postgresql/data
      # Mount toàn bộ lab vào container để chạy psql -f trực tiếp bên trong,
      # không cần cài psql/postgres trên máy host.
      - ./:/lab:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d optimize_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lab_data:
